name: Testes API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Iniciar Mongo
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: 7.0

      - name: Criar .env
        run: |
          echo BASE_URL=http://localhost:3000 >> .env
          echo ADMIN_EMAIL=admin@escola.com >> .env
          echo ADMIN_PASSWORD=admin123 >> .env

      - name: Iniciar API em segundo plano
        run: |
          node src/server.js &
          npx wait-on http://localhost:3000 --timeout 15000

      - name: Executar testes
        run: npm test
